name: CI

# Runs on every PR and on every push to `main`. Four jobs:
#
# 0. lint       — pinned ruff + isort over a deliberately NARROW rule set. See
#                 the job comment and pyproject.toml for why the version and the
#                 `--select` are both pinned, and why `black` is not gated yet.
# 1. unit       — fast pytest run with respx-mocked HTTP. Catches logic
#                 regressions in <30s without touching docker.
# 2. eval-fast  — deterministic prompt-registration suite. Asserts every
#                 Prompt registered via @mcp.prompt() surfaces the
#                 expected tool names. No live LLM required.
# 3. e2e        — boots the actual image via docker compose with a real
#                 Redis 7 sidecar and runs `tests/e2e/`. This is the layer
#                 that catches the kind of bug that broke v1.4.37-audit2
#                 in production: OAuth /register failed because the wiring
#                 between FastMCP and `key_value.aio.stores.redis.RedisStore`
#                 doesn't survive contact with a real Redis backend.
#
# All four jobs must pass before merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Generate from the committed, reviewed schema snapshot (scripts/openapi.snapshot.json)
# instead of a build-time live OpenAPI fetch, so CI tests exactly the deterministic
# surface prod ships. See FR_PIN_SCHEMA in scripts/generate_mcp_tools.py.
env:
  FR_PIN_SCHEMA: "1"

jobs:
  # Placed first in this map on purpose: a follow-up PR appends another job at
  # the end, and two branches appending to the same spot would conflict.
  #
  # Scope is narrow and pinned, not aspirational:
  #   - ruff and isort are pinned EXACTLY in requirements-test.txt, because
  #     ruff's default rule set expands between releases. Pinning the version
  #     without pinning `--select` (or vice versa) still lets the gate change
  #     meaning without a reviewable diff, so both are pinned.
  #   - `--select E4,E7,E9,F` is the subset that only ever catches real bugs.
  #     Under 0.16.2's *defaults* this repo reports 48 findings (mostly UP045
  #     annotation modernization and BLE001 blind-except). Widening is its own
  #     PR: several of those blind-excepts are deliberate fail-closed handlers
  #     in the auth path and need individual review, not a bulk fix.
  #   - `--exclude src/financial_reports_mcp.py` matters. That module is
  #     build-time generated and git-ignored, but it exists on disk here because
  #     the `unit` job renders it, and ruff would otherwise lint ~218 KB of
  #     emitted code whose only real fix is editing the generator's templates.
  #     (isort gets the same exclusion via pyproject.toml, since isort does not
  #     honour .gitignore.)
  #   - `black --check` is deliberately NOT gated yet: 27 of 33 files are unclean
  #     at 88 columns (~866 diff lines). It lands as its own whitespace-only PR,
  #     then gets gated here.
  #
  # No Cognito env vars and no generation step: this job imports nothing.
  lint:
    name: Lint — ruff + isort (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install lint deps
        run: pip install -r requirements-test.txt
      - name: ruff
        run: ruff check src tests scripts --select E4,E7,E9,F --exclude src/financial_reports_mcp.py
      - name: isort
        run: isort --check-only --profile black src tests scripts

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime + test deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Render generated module
        # The runtime module is build-time generated. We render it once so
        # the unit tests can import it; the e2e job redoes this inside the
        # docker build.
        run: python scripts/generate_mcp_tools.py
      - name: Run pytest (unit + decorator + subscription + app routes)
        run: pytest tests/test_*.py -v --tb=short

  eval-fast:
    name: Eval — fast prompt-registration suite
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - name: Render generated module
        run: python scripts/generate_mcp_tools.py
        env:
          COGNITO_USER_POOL_ID: eu-central-1_CITESTPOOL
          COGNITO_CLIENT_ID: ci_client
          COGNITO_CLIENT_SECRET: ci_secret
      - name: Run deterministic eval suite
        run: pytest tests/eval/ -v
        env:
          COGNITO_USER_POOL_ID: eu-central-1_CITESTPOOL
          COGNITO_CLIENT_ID: ci_client
          COGNITO_CLIENT_SECRET: ci_secret
      - name: Verify docs/token-budget.md is in sync with current generator
        # If a tool description or schema changes without `make audit`, the
        # committed baseline silently goes stale. Fail loudly instead.
        run: |
          python scripts/audit_token_budget.py > /tmp/token-budget.md
          diff -u docs/token-budget.md /tmp/token-budget.md || { \
            echo "::error::docs/token-budget.md is stale — run 'make audit' and commit the result"; \
            exit 1; \
          }
        env:
          COGNITO_USER_POOL_ID: eu-central-1_CITESTPOOL
          COGNITO_CLIENT_ID: ci_client
          COGNITO_CLIENT_SECRET: ci_secret

  e2e:
    name: E2E (docker compose)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install host-side test deps
        # Same file as the unit job. Pytest loads tests/conftest.py for
        # every collection root under tests/ — including tests/e2e/ — so
        # respx must be on the path even though e2e tests don't import it
        # directly. (This is what broke the first CI run.)
        run: pip install -r requirements-test.txt
      - name: Run docker-compose e2e suite (DiskStore + Redis variants)
        run: ./scripts/test-e2e.sh both
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

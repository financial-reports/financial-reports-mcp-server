name: OpenAPI snapshot drift

# Weekly watchdog over `scripts/openapi.snapshot.json`.
#
# CI and the Docker image both build with FR_PIN_SCHEMA=1, so the served tool
# surface is rendered from the committed snapshot, not from a live fetch. That
# makes releases deterministic — and makes the snapshot go stale invisibly. It
# sat frozen at info.version 1.1.5 for ~2 months while the generated-SDK pin was
# bumped 14 times, which is exactly the failure mode this job exists to surface.
#
# The important output is NOT "the version changed". It is the list of new
# operations that would join the *default* LLM-facing surface: `_PRUNED_EXCLUDE`
# in scripts/generate_mcp_tools.py is a denylist, so a new upstream endpoint
# reaches every connected client automatically once the snapshot is refreshed.
# Keeping one off is the part that takes a decision.
#
# The checker itself always exits 0 and signals through its `drifted` output, so
# a transient upstream outage produces an artifact that says "could not check"
# instead of a red weekly build and a spurious issue.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so it doesn't pile into GitHub's
    # top-of-hour cron congestion.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Diff live schema against the committed snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime deps
        # The checker needs httpx + PyYAML for itself, and Jinja2 as well
        # because it imports scripts/generate_mcp_tools.py to borrow SCHEMA_URL
        # and _PRUNED_EXCLUDE (import-only — the generator's module body has no
        # side effects; its fetch and its file write both live in main()).
        run: pip install -r requirements.txt

      - name: Check for drift
        id: drift
        # No FR_PIN_SCHEMA and no Cognito vars here: unlike ci.yml, this job
        # never invokes the generator's main() and never imports the generated
        # module. It reads scripts/openapi.snapshot.json directly and fetches
        # the live schema itself.
        run: python scripts/check_schema_drift.py --report drift-report.md

      - name: Publish the report to the run summary
        if: always()
        run: cat drift-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-drift-report
          path: drift-report.md
          if-no-files-found: warn

      - name: Open or update the tracking issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Idempotent: the label is created once by hand in the upstream repo,
          # but a fork running this workflow won't have it and
          # `gh issue create --label` hard-fails on a missing label.
          gh label create openapi-drift \
            --color B60205 \
            --description "Live OpenAPI schema has drifted from scripts/openapi.snapshot.json" \
            || echo "label openapi-drift already exists"

          # Dedupe on the label, not the title: one long-lived issue that
          # accumulates a comment per drifting week, rather than 52 issues.
          existing=$(gh issue list \
            --label openapi-drift \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift-report.md
            echo "Commented on existing drift issue #${existing}"
          else
            gh issue create \
              --title "OpenAPI snapshot drift: live schema is ahead of scripts/openapi.snapshot.json" \
              --label openapi-drift \
              --body-file drift-report.md
          fi
